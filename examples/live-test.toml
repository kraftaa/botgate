[policy]
require_authority = true
require_method = true
require_path = true
query = "required"
body = "ignore"
max_age_seconds = 300
max_lifetime_seconds = 300
allowed_future_skew_seconds = 30
require_nonce = false

[target]
allow_private = true
allow_http = true
timeout_seconds = 10
max_response_bytes = 1048576

[expect]
header = "X-Botgate-Authenticated"
authenticated_value = "true"
unauthenticated_value = "false"

[expect.access]
header = "X-Botgate-Access"
allowed_value = "allowed"
denied_value = "denied"

# Expected application-access results per case. These match `botgate demo serve`, whose
# endpoint is deliberately public, so every case is "allowed" — even a corrupted signature.
# For a real server, set each case to what that endpoint should do; copied unchanged, these
# expectations cannot detect missing access control.
[expect.access.cases]
original = "allowed"
changed_method = "allowed"
changed_path = "allowed"
changed_query = "allowed"
changed_authority = "allowed"
changed_signed_header = "allowed"
changed_body = "allowed"
corrupted_signature = "allowed"
removed_signature_agent = "allowed"
changed_signature_agent = "allowed"
expired = "allowed"
future_created = "allowed"
long_expiration = "allowed"
missing_expires = "allowed"
unknown_key = "allowed"

[tests]
changed_method = true
changed_path = true
changed_query = true
changed_authority = true
changed_signed_header = true
changed_body = true
corrupted_signature = true
removed_signature_agent = true
changed_signature_agent = true
expired = true
future_created = true
long_expiration = true
missing_expires = true
unknown_key = true
