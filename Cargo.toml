[package]
name = "botgate"
version = "0.4.2"
edition = "2024"
description = "Test what Web Bot Auth signatures protect and whether servers enforce the intended policy"
license = "MIT"
rust-version = "1.86"
repository = "https://github.com/kraftaa/botgate"
homepage = "https://github.com/kraftaa/botgate"
readme = "README.md"
keywords = ["web-bot-auth", "http-signatures", "rfc9421", "ed25519", "bots"]
categories = ["command-line-utilities", "cryptography", "authentication"]
include = ["/src", "/examples", "/tests", "/README.md", "/SECURITY.md", "/LICENSE-MIT"]

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
toml = "1.1"
url = "2.5"

[dev-dependencies]
proptest = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
